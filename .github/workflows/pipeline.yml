            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 7 — Legacy Colab parte 2  (sin Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_7_legacy_colab_2:
    name: 'Grupo 7 — Legacy Colab (2/2)'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '7'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias Python
        run: pip install -r requirements-legacy.txt

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only el_financiero el_mundo el_seminario eldelfino \
                   elnortehoy lanacion larepublica noticias_la_garita_costa_rica \
                   periodico_el_mundo periodico_mi_tierra sancarlosdigital seminario \
            --workers 8 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-7
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # CONSOLIDAR — Une todos los CSVs en corpus maestro
  # ─────────────────────────────────────────────────────────────────
  consolidar_corpus:
    name: 'Consolidar corpus maestro'
    runs-on: ubuntu-latest
    needs:
      - grupo_1_rapidos
      - grupo_2_medianos
      - grupo_3_lentos
      - grupo_4_muy_lentos
      - grupo_5_wordpress
      - grupo_6_legacy_colab_1
      - grupo_7_legacy_colab_2
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Descargar outputs de todos los grupos
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Mover CSVs a output/
        run: |
          mkdir -p output/
          find artifacts/ -name "*.csv" ! -name "*discarded*" -exec cp {} output/ \;
          echo "CSVs disponibles: $(ls output/*.csv 2>/dev/null | wc -l)"
          ls output/*.csv 2>/dev/null || echo "Sin CSVs"

      - name: Construir corpus maestro
        run: |
          python corpus_builder.py \
            --output output/ \
            --corpus corpus/

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-maestro
          path: corpus/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-ejecucion
          path: logs/
          retention-days: 7
