name: Observatorio Democrático — Pipeline de Scraping

on:
  # Ejecución automática diaria a las 6 AM hora Costa Rica (12:00 UTC)
  schedule:
    - cron: '0 12 * * *'

  # Ejecución manual desde GitHub → Actions → Run workflow
  workflow_dispatch:
    inputs:
      grupo:
        description: 'Grupo a ejecutar (1-5 o "todos")'
        required: false
        default: 'todos'
      test_mode:
        description: 'Modo prueba (true/false)'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.12'
  # Display virtual para que Playwright funcione como navegador real
  DISPLAY: ':99'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # GRUPO 1 — Scrapers rápidos
  # ─────────────────────────────────────────────────────────────────
  grupo_1_rapidos:
    name: 'Grupo 1 — Rápidos'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '1'
    timeout-minutes: 90

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils
          sudo apt-get install -y libgconf-2-4 libatk1.0-0 libatk-bridge2.0-0
          sudo apt-get install -y libcups2 libdrm2 libxkbcommon0 libxcomposite1
          sudo apt-get install -y libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 libpango-1.0-0 libpangocairo-1.0-0

      - name: Iniciar pantalla virtual (simula navegador real)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only presidencia elperiodicocr sinartdigital monumental \
                   telediario pulsocr theglobalcr costaricastar ticosland \
                   caribeactual puntarenasseoye \
            --workers 4 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - name: Subir outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-1
          path: |
            output/*.csv
            logs/*.json
            logs/*.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 2 — Scrapers medianos
  # ─────────────────────────────────────────────────────────────────
  grupo_2_medianos:
    name: 'Grupo 2 — Medianos'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '2'
    timeout-minutes: 120

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils
          sudo apt-get install -y libgconf-2-4 libatk1.0-0 libatk-bridge2.0-0
          sudo apt-get install -y libcups2 libdrm2 libxkbcommon0 libxcomposite1
          sudo apt-get install -y libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 libpango-1.0-0 libpangocairo-1.0-0

      - name: Iniciar pantalla virtual
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only ncrnoticias ticotimes trivisioncr latejacr \
                   mundiario rumboeconomico vozdeguanacaste \
                   elmundo elcolectivo506 eljornalcr \
            --workers 4 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - name: Subir outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-2
          path: |
            output/*.csv
            logs/*.json
            logs/*.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 3 — Scrapers lentos
  # ─────────────────────────────────────────────────────────────────
  grupo_3_lentos:
    name: 'Grupo 3 — Lentos'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '3'
    timeout-minutes: 150

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils
          sudo apt-get install -y libgconf-2-4 libatk1.0-0 libatk-bridge2.0-0
          sudo apt-get install -y libcups2 libdrm2 libxkbcommon0 libxcomposite1
          sudo apt-get install -y libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 libpango-1.0-0 libpangocairo-1.0-0

      - name: Iniciar pantalla virtual
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only lareaccioncr noticiasenlineacr puroperiodismo \
                   larevistacr lavozdegoicoechea \
                   elmonitorcr enlamira \
            --workers 3 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - name: Subir outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-3
          path: |
            output/*.csv
            logs/*.json
            logs/*.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 4 — Scrapers muy lentos
  # ─────────────────────────────────────────────────────────────────
  grupo_4_muy_lentos:
    name: 'Grupo 4 — Muy lentos'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '4'
    timeout-minutes: 180

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils
          sudo apt-get install -y libgconf-2-4 libatk1.0-0 libatk-bridge2.0-0
          sudo apt-get install -y libcups2 libdrm2 libxkbcommon0 libxcomposite1
          sudo apt-get install -y libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 libpango-1.0-0 libpangocairo-1.0-0

      - name: Iniciar pantalla virtual
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only teletica repretel genteopa \
            --workers 2 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - name: Subir outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-4
          path: |
            output/*.csv
            logs/*.json
            logs/*.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 5 — WordPress sites
  # ─────────────────────────────────────────────────────────────────
  grupo_5_wordpress:
    name: 'Grupo 5 — WordPress'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '5'
    timeout-minutes: 120

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils
          sudo apt-get install -y libgconf-2-4 libatk1.0-0 libatk-bridge2.0-0
          sudo apt-get install -y libcups2 libdrm2 libxkbcommon0 libxcomposite1
          sudo apt-get install -y libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 libpango-1.0-0 libpangocairo-1.0-0

      - name: Iniciar pantalla virtual
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only adiariocr alajuelitasoy buzonderodrigo \
                   guanacastealaaltura miprensacr periodicomensaje \
                   radiolapampa ustedseinforma \
            --workers 4 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - name: Subir outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-5
          path: |
            output/*.csv
            logs/*.json
            logs/*.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # CONSOLIDAR — Une todos los CSVs en corpus maestro
  # Corre después de que todos los grupos terminen
  # ─────────────────────────────────────────────────────────────────
  consolidar_corpus:
    name: 'Consolidar corpus maestro'
    runs-on: ubuntu-latest
    needs:
      - grupo_1_rapidos
      - grupo_2_medianos
      - grupo_3_lentos
      - grupo_4_muy_lentos
      - grupo_5_wordpress
    if: always()

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Descargar outputs de todos los grupos
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Mover CSVs a output/
        run: |
          mkdir -p output/
          find artifacts/ -name "*.csv" ! -name "*discarded*" -exec cp {} output/ \;
          echo "──────────────────────────────────────"
          echo "CSVs disponibles para consolidar:"
          ls output/*.csv 2>/dev/null || echo "  Sin CSVs"
          echo "Total: $(ls output/*.csv 2>/dev/null | wc -l) archivos"
          echo "──────────────────────────────────────"

      - name: Construir corpus maestro
        run: |
          python corpus_builder.py \
            --output output/ \
            --corpus corpus/

      - name: Mostrar resumen del corpus
        run: |
          echo "──────────────────────────────────────"
          echo "Corpus generado:"
          ls -lh corpus/*.csv 2>/dev/null || echo "  Sin corpus"
          echo "──────────────────────────────────────"

      - name: Subir corpus maestro
        uses: actions/upload-artifact@v4
        with:
          name: corpus-maestro
          path: corpus/
          retention-days: 30

      - name: Subir reporte de ejecución
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-ejecucion
          path: logs/
          retention-days: 7
