  # ─────────────────────────────────────────────────────────────────
  # GRUPO 5 — WordPress + Legacy sin Playwright
  # ─────────────────────────────────────────────────────────────────
  grupo_5_wordpress:
    name: 'Grupo 5 — WordPress + Legacy'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '5'
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias Python
        run: pip install -r requirements-legacy.txt

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only adiariocr actualidaddeloeste alajuelitahoy alajuelitasoy \
                   anexioncr buzonderodrigo guanacastealaaltura miprensacr \
                   periodicomensaje radiolapampa radiopuertotv tamarindonews \
                   tvsur ustedseinforma yambaradio \
                   elmundo elcolectivo506 eljornalcr \
                   elmonitorcr enlamira \
            --workers 8 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-5
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 6 — Legacy Colab parte 1  (sin Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_6_legacy_colab_1:
    name: 'Grupo 6 — Legacy Colab (1/2)'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '6'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias Python
        run: pip install -r requirements-legacy.txt

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only acontecer_cr acontecercr alajuela_digital amprensa \
                   crc_89_1 crhoy diarioextra digital506 \
                   el_jilguero el_jornal el_observador el_sol_de_occidente \
            --workers 8 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-6
          path: |
