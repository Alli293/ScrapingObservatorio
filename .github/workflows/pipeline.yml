name: Observatorio Democrático — Pipeline de Scraping

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      grupo:
        description: 'Grupo a ejecutar (1-7 o "todos")'
        required: false
        default: 'todos'
      test_mode:
        description: 'Modo prueba (true/false)'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.12'
  DISPLAY: ':99'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # GRUPO 1 — Scrapers rápidos  (Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_1_rapidos:
    name: 'Grupo 1 — Rápidos'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '1'
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only presidencia elperiodicocr sinartdigital monumental \
                   telediario pulsocr theglobalcr costaricastar ticosland \
                   caribeactual puntarenasseoye \
            --workers 4 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-1
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 2 — Scrapers medianos  (Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_2_medianos:
    name: 'Grupo 2 — Medianos'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '2'
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only ncrnoticias ticotimes trivisioncr latejacr \
                   mundiario rumboeconomico vozdeguanacaste \
            --workers 6 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-2
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 3 — Scrapers lentos  (Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_3_lentos:
    name: 'Grupo 3 — Lentos'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '3'
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar scrapers
        run: |
          python pipeline_runner.py \
            --only lareaccioncr noticiasenlineacr puroperiodismo \
                   larevistacr lavozdegoicoechea \
            --workers 4 \
            --skip-health \
            ${{ github.event.inputs.test_mode == 'true' && '--test' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-grupo-3
          path: |
            output/*.csv
            logs/*.json
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # GRUPO 4 — Scrapers muy lentos  (Playwright)
  # ─────────────────────────────────────────────────────────────────
  grupo_4_muy_lentos:
    name: 'Grupo 4 — Muy lentos'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.grupo == 'todos' ||
      github.event.inputs.grupo == '4'
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Instalar dependencias Python
        run: |
